<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 256 px variant: tile with the first "a" of the wordmark (same geometry and line); the upper left quarter of the ring is the light progress segment -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D1D27"/>
      <stop offset="1" stop-color="#0A0A0E"/>
    </linearGradient>
    <linearGradient id="tileEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="ambient" cx="512" cy="512" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3498E5" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3498E5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="-114" x2="0" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5DB6F3"/>
      <stop offset="1" stop-color="#2A8FDF"/>
    </linearGradient>
    <linearGradient id="segment" x1="20" y1="0" x2="120" y2="-100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BFE4FF"/>
      <stop offset="1" stop-color="#8ED1FA"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="64" y="64" width="896" height="896" rx="200"/>
    </clipPath>
    <!-- Keeps the cuts dark: the glow is left out there -->
    <mask id="cuts" maskUnits="userSpaceOnUse" x="-200" y="-300" width="700" height="600">
      <rect x="-200" y="-300" width="700" height="600" fill="#FFFFFF"/>
      <path d="M 46.4,-18.1 L -11.6,-33.6 M 132.1,-67.6 L 147.6,-125.6" stroke="#000000" stroke-width="12"/>
    </mask>
  </defs>

  <!-- Tile -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)"/>
  <g clip-path="url(#tileClip)">
    <rect x="64" y="64" width="896" height="896" fill="url(#ambient)"/>
  </g>
  <rect x="65.5" y="65.5" width="893" height="893" rx="198.5" fill="none" stroke="url(#tileEdge)" stroke-width="3"/>

  <g transform="translate(227 512) scale(2.5)" fill="none" stroke-width="28">
    <!-- Soft glow -->
    <g mask="url(#cuts)">
      <g filter="url(#blur)" opacity="0.45" stroke="#3498E5">
        <path d="M 15.5,-17.4 A 100,100 0 1 0 148.2,-94.0 M 214,0 L 214,100" stroke-linecap="round"/>
        <path d="M 131.4,-98.5 A 100,100 0 0 0 20.0,-34.2"/>
      </g>
    </g>
    <!-- Ring, stem and progress segment -->
    <path d="M 15.5,-17.4 A 100,100 0 1 0 148.2,-94.0" stroke="url(#line)"/>
    <path d="M 214,0 L 214,100" stroke="url(#line)" stroke-linecap="round"/>
    <path d="M 131.4,-98.5 A 100,100 0 0 0 20.0,-34.2" stroke="url(#segment)"/>
  </g>
</svg>
