<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <!-- Placeholder cover (2:3) for profiles without a fitting cover: the first "a" of the wordmark (same geometry and line as the app icon) with its light progress segment -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D1D27"/>
      <stop offset="1" stop-color="#0A0A0E"/>
    </linearGradient>
    <radialGradient id="ambient" cx="300" cy="450" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3498E5" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#2289DA" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#3498E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientTop" cx="470" cy="120" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7CC8F7" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7CC8F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="-114" x2="0" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5DB6F3"/>
      <stop offset="1" stop-color="#2A8FDF"/>
    </linearGradient>
    <linearGradient id="segment" x1="20" y1="0" x2="120" y2="-100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BFE4FF"/>
      <stop offset="1" stop-color="#8ED1FA"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <!-- Keeps the cuts dark: the glow is left out there -->
    <mask id="cuts" maskUnits="userSpaceOnUse" x="-200" y="-300" width="700" height="600">
      <rect x="-200" y="-300" width="700" height="600" fill="#FFFFFF"/>
      <path d="M 30.9,-22.3 L 3.9,-29.5 M 136.3,-83.1 L 143.5,-110.1" stroke="#000000" stroke-width="12"/>
    </mask>
  </defs>

  <!-- Background -->
  <rect width="600" height="900" fill="url(#bg)"/>
  <rect width="600" height="900" fill="url(#ambient)"/>
  <rect width="600" height="900" fill="url(#ambientTop)"/>

  <!-- The "a", centered on the cover -->
  <g transform="translate(140 450) scale(1.4)" fill="none" stroke-width="28">
    <g mask="url(#cuts)">
      <g filter="url(#blur)" opacity="0.55" stroke="#3498E5">
        <path d="M 15.5,-17.4 A 100,100 0 1 0 148.2,-94.0 M 214,0 L 214,100" stroke-linecap="round"/>
        <path d="M 131.4,-98.5 A 100,100 0 0 0 20.0,-34.2"/>
      </g>
    </g>
    <path d="M 15.5,-17.4 A 100,100 0 1 0 148.2,-94.0" stroke="url(#line)"/>
    <path d="M 214,0 L 214,100" stroke="url(#line)" stroke-linecap="round"/>
    <path d="M 131.4,-98.5 A 100,100 0 0 0 20.0,-34.2" stroke="url(#segment)"/>
  </g>

  <rect width="600" height="900" fill="url(#vignette)"/>
</svg>
