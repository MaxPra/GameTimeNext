<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <!-- Placeholder cover (2:3) for profiles without a fitting cover: the glass cover of the app icon, G line only started -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D1D27"/>
      <stop offset="1" stop-color="#0A0A0E"/>
    </linearGradient>
    <radialGradient id="ambient" cx="300" cy="560" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3498E5" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#2289DA" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#3498E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientTop" cx="470" cy="120" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7CC8F7" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7CC8F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="glass" x1="343" y1="292" x2="673" y2="732" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#15629E" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="343" y1="292" x2="673" y2="732" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="line" x1="343" y1="292" x2="343" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7CC8F7"/>
      <stop offset="1" stop-color="#3498E5"/>
    </linearGradient>
    <radialGradient id="tip" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#BFE4FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3498E5" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="900" fill="url(#bg)"/>
  <rect width="600" height="900" fill="url(#ambient)"/>
  <rect width="600" height="900" fill="url(#ambientTop)"/>

  <!-- Same geometry as icon_large.svg, centered on the cover -->
  <g transform="translate(300 450) scale(0.98) translate(-480 -468)">
    <!-- Library cards behind -->
    <rect x="263" y="204" width="278" height="370" rx="46" fill="#FFFFFF" fill-opacity="0.025" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="3"/>
    <rect x="303" y="248" width="304" height="405" rx="50" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.11" stroke-width="3"/>

    <!-- Front cover (glass) -->
    <rect x="343" y="292" width="330" height="440" rx="56" fill="#0E0E14"/>
    <rect x="343" y="292" width="330" height="440" rx="56" fill="url(#glass)" stroke="url(#glassEdge)" stroke-width="3"/>

    <!-- Track of the whole mark (G with T and N), not played yet -->
    <path d="M 595 292 L 399 292 A 56 56 0 0 0 343 348 L 343 676 A 56 56 0 0 0 399 732 L 617 732 A 56 56 0 0 0 673 676 L 673 551 A 30 30 0 0 0 643 521 L 423 521 M 548 521 L 548 732 M 548 521 L 657 716"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Started progress line: glow, then line (first part of the G only) -->
    <g filter="url(#blur)" opacity="0.65">
      <path d="M 595 292 L 399 292 A 56 56 0 0 0 343 348 L 343 554"
            fill="none" stroke="#3498E5" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="673" cy="292" r="25" fill="#3498E5"/>
    </g>
    <path d="M 595 292 L 399 292 A 56 56 0 0 0 343 348 L 343 554"
          fill="none" stroke="url(#line)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="673" cy="292" r="25" fill="#8ED1FA"/>
    <!-- Leading tip of the progress line -->
    <circle cx="343" cy="554" r="34" fill="url(#tip)" opacity="0.6"/>
  </g>

  <rect width="600" height="900" fill="url(#vignette)"/>
</svg>
